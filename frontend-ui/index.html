<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RelAte | WhiteBlue Talent Retrieval & Re-Engagement Engine</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="brand">
        <span class="logo-mark">⚡</span>
        <div>
          <h1>RelAte</h1>
          <p class="subtitle">WhiteBlue Internal Talent Retrieval & Re-Engagement Engine</p>
        </div>
      </div>
      <div class="header-actions">
        <div class="source-toggle">
          <label>Data Mode:</label>
          <select id="dataModeSelect">
            <option value="mock">Local Mock (Zero-blocker)</option>
            <option value="live">Live Backend (localhost:8000)</option>
          </select>
        </div>
        <span class="badge pool-badge">Repository: 10,000+ Resumes</span>
      </div>
    </header>

    <!-- Main Workspace -->
    <main class="main-layout">
      <!-- Left Panel: JD Parser & Criteria Editor -->
      <section class="panel criteria-panel">
        <div class="panel-header">
          <h2>1. Job Description & Criteria</h2>
          <span class="step-indicator">Track 3 / Priya</span>
        </div>

        <div class="form-group">
          <label for="jdTextInput">Paste Job Description:</label>
          <textarea id="jdTextInput" rows="7" placeholder="Paste full Job Description text here..."></textarea>
          <div class="button-row">
            <button id="btnParseJD" class="btn btn-secondary">⚡ Parse with AI</button>
            <button id="btnLoadSampleJD" class="btn btn-ghost">Load Sample JD</button>
          </div>
        </div>

        <hr class="divider">

        <div class="extracted-criteria">
          <div class="form-group">
            <label for="roleTitleInput">Extracted Role Title:</label>
            <input type="text" id="roleTitleInput" value="Senior .NET Backend Engineer">
          </div>

          <div class="form-group">
            <label>Mandatory Skills <span class="tag-hint">(Weight: 70% | Non-negotiable)</span>:</label>
            <div id="mandatoryChips" class="chips-container"></div>
            <div class="chip-input-group">
              <input type="text" id="newMandatoryInput" placeholder="Add mandatory skill...">
              <button id="btnAddMandatory" class="btn-sm">+</button>
            </div>
          </div>

          <div class="form-group">
            <label>Optional Skills <span class="tag-hint">(Weight: 20% | Preferred)</span>:</label>
            <div id="optionalChips" class="chips-container"></div>
            <div class="chip-input-group">
              <input type="text" id="newOptionalInput" placeholder="Add optional skill...">
              <button id="btnAddOptional" class="btn-sm">+</button>
            </div>
          </div>

          <div class="form-group">
            <div class="exp-header">
              <label for="minExpInput">Minimum Experience:</label>
              <span id="expValueDisplay">3 Years</span>
            </div>
            <input type="range" id="minExpInput" min="0" max="15" step="0.5" value="3">
          </div>

          <button id="btnSearchCandidates" class="btn btn-primary btn-block">
            🔍 Retrieve & Rank Talent Pool
          </button>
        </div>
      </section>

      <!-- Right Panel: Ranked Candidate Shortlist -->
      <section class="panel candidates-panel">
        <div class="panel-header candidates-header">
          <div>
            <h2>2. Ranked Shortlist</h2>
            <p id="matchCountText" class="subtitle">Surfacing top technical matches</p>
          </div>
          <div class="action-buttons">
            <button id="btnCopyTracker" class="btn btn-secondary">📋 Copy for Outreach</button>
            <button id="btnExportCSV" class="btn btn-secondary">📥 Export CSV</button>
          </div>
        </div>

        <div id="candidatesList" class="candidates-list">
          <!-- Rendered dynamically -->
        </div>
      </section>
    </main>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
